name: Go

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5

      - name: Install dependencies
        run: go get .

      - name: Build
        run: go build -v ./...
        
      - name: Test with the Go CLI
        run: go test -v ./...